name: Django CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    # 1. Ye step aapka code GitHub se runner (server) me download karta hai
    - name: Checkout Source Code
      uses: actions/checkout@v3

    # 2. Ye step Python environment setup karta hai
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. Ye step zaroori libraries (dependencies) install karta hai
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt

    # 4. Ye step aapke banaye hue Pytest unit tests run karta hai
    - name: Run Pytest
      run: |
        cd backend
        pytest
